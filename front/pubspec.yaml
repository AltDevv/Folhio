name: folhio
description: "Aplicativo multiplataforma Folhio."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  drift: ^2.22.1
  file_picker: ^10.3.7
  google_sign_in: ^7.2.0
  http: ^1.6.0
  path: ^1.9.1
  path_provider: ^2.1.5
  share_plus: ^11.0.0
  sqlite3_flutter_libs: ^0.5.26
  speech_to_text: ^7.0.0
  flutter_secure_storage: ^10.3.1
  cryptography: ^2.9.0
  sqlcipher_flutter_libs: ^0.7.0+eol

dev_dependencies:
  build_runner: ^2.4.13
  drift_dev: ^2.22.1

  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/folhio_icon_transparent.png